name: Golden Pipeline Security Scans

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  security-scans:
    name: Multi-Stack Gitleaks, Semgrep & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Detection Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Semgrep SAST Scan (Fail Closed)
        run: |
          echo "Installing Semgrep..."
          python3 -m pip install semgrep
          echo "Executing Semgrep security scan against auto ruleset across Python, Java, and .NET..."
          semgrep scan --config auto --error --timeout 180 .

      - name: Set up Python for Pip-audit
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Pip-audit Dependency Vulnerability Scan
        run: |
          echo "Executing pip-audit across Python requirements..."
          python3 -m pip install pip-audit
          REQ_FILES=$(find . -name "requirements.txt" || true)
          for req in $REQ_FILES; do
            echo "Auditing $req..."
            pip-audit -r "$req" --desc || true
          done

      - name: Set up .NET Core for Dependency Vulnerability Audit
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: .NET Vulnerable Package Audit
        run: |
          DOTNET_PROJS=$(find . -name "*.csproj" || true)
          for proj in $DOTNET_PROJS; do
            echo "Scanning .NET packages for $proj..."
            dotnet list "$proj" package --vulnerable --include-transitive || true
          done
