name: Golden Pipeline Security Scans

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  security-scans:
    name: Gitleaks, Semgrep & Pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Detection Scan
        uses: gitleaks/gitleaks-action@789e52d6a506f522300b991bf1cc8534005b4a59 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Semgrep SAST Scan (Fail Closed)
        run: |
          echo "Installing Semgrep..."
          python3 -m pip install semgrep
          echo "Executing Semgrep security scan against auto ruleset..."
          semgrep scan --config auto --error --timeout 120 .

      - name: Set up Python for Pip-audit
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Pip-audit Dependency Vulnerability Scan
        run: |
          echo "Installing and executing pip-audit..."
          python3 -m pip install pip-audit
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --desc
          else
            echo "No requirements.txt found, skipping pip-audit."
          fi
