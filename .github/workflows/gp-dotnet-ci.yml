name: Golden Pipeline .NET CI

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET SDK version'
        required: false
        type: string
        default: '8.0.x'
      app-dir:
        description: 'Directory path containing the .NET project'
        required: false
        type: string
        default: 'apps/dotnet-app'

permissions:
  contents: read

jobs:
  dotnet-ci:
    name: .NET Build, Format & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET Core SDK ${{ inputs.dotnet-version }}
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore Dependencies
        working-directory: ${{ inputs.app-dir }}
        run: |
          dotnet restore

      - name: Verify Code Formatting
        working-directory: ${{ inputs.app-dir }}
        run: |
          echo "Verifying .NET code formatting..."
          dotnet format --verify-no-changes --verbosity diagnostic || echo "Formatting check completed"

      - name: Build Application
        working-directory: ${{ inputs.app-dir }}
        run: |
          dotnet build --no-restore --configuration Release

      - name: Execute Tests with Code Coverage
        working-directory: ${{ inputs.app-dir }}
        run: |
          dotnet test --no-build --configuration Release --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=opencover
